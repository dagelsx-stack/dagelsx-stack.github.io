/* Cifrado: re-cifra datos, respaldos e imágenes con el PIN nuevo */
async function nxRekey(np){try{if(!(window.crypto&&crypto.subtle))throw 0;const keep=[];for(const x of bk()){try{keep.push({t:x.t,d:x.e?await NXC.dec(x.e):x.d})}catch(e){}}

async function nxUnenc(){try{const out=[];for(const x of bk()){try{out.push({t:x.t,d:x.e?await NXC.dec(x.e):x.d})}catch(e){}}await(IMGP||0);NXC.disable();localStorage.setItem('nexora.bk',JSON.stringify(out));Object.keys(IMGC).forEach(k=>imgPut(k,IMGC[k]));save();flushSave()}catch(e){}}
/* Comprobante por WhatsApp o correo (abre la app con el texto listo) */
const nxRcpt=s=>[S.biz||'Negocio','Comprobante '+s.no,new Date(s.ts).toLocaleString('es-ES'),''].concat(s.lines.map(l=>'• '+l.name+' x'+l.qty+' — '+usd(l.net)),[''],s.disc?['Descuentos: -'+usd(s.disc)]:[],['Total: '+usd(s.total)],s.pays.map(p=>p.pm+': '+usd(p.usd)),POS.pend(s)?['Saldo pendiente: '+usd(POS.pend(s))]:[],['','Comprobante de venta, no es factura fiscal.']).join('\n');
const nxSend=(s,c)=>{if(!c)return'';const w=waL(c.ph),m=String(c.em||'').trim(),t=nxRcpt(s);let h='';if(w)h+=` <a class="b2 sm lk" href="${esc(w+'?text='+encodeURIComponent(t))}" target="_blank" rel="noopener">WhatsApp</a>`;if(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m))h+=` <a class="b2 sm lk" href="${esc('mailto:'+m+'?subject='+encodeURIComponent((S.biz||'Nexora')+' · Comprobante '+s.no)+'&body='+encodeURIComponent(t))}">Correo</a>`;return h};
/* ===== Ticket de compra como imagen (canvas) ===== */
const nxFmt=n=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'});
let NXTB=null;
async function nxTicket(s,c){
 const P=S.profile||{},T=P.tk||{},W=560,Lx=52,Rx=W-52,CW=Rx-Lx,DPR=2,FF='Manrope,system-ui,Arial,sans-serif';
 try{await document.fonts.load('800 20px Manrope');await document.fonts.load('600 20px Manrope')}catch(e){}
 const logo=T.logo?await new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ok(null);i.src=T.logo}):null;
 const rate=(s.pays.find(p=>p.cur=='VES'&&p.rate>1)||{}).rate||+(S.rates&&S.rates.usd)||0;
 const no=String(s.no).replace(/\D/g,'').padStart(4,'0'),dt=new Date(s.ts).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});

 const run=(g,dr,H)=>{
  g.textBaseline='middle';
  const txt=(t,x,y,f,al,col)=>{if(!dr)return;g.font=f;g.textAlign=al||'left';g.fillStyle=col||'#111';g.fillText(t,x,y)};

  if(dr){const t=12,x0=22,x1=W-22,n=Math.floor((x1-x0)/t);g.fillStyle='#000';g.fillRect(0,0,W,H);g.fillStyle='#f5f5f3';g.beginPath();g.moveTo(x0,10);for(let i=1;i<=n;i++)g.lineTo(x0+i*t,i%2?24:10);g.lineTo(x1,H-10);for(let i=n;i>=0;i--)g.lineTo(x0+i*t,i%2?H-24:H-10);g.closePath();g.fill()}

  [['Tel',P.phone],['Correo',P.email],['Instagram',ig&&'@'+ig],['Dirección',P.addr]].forEach(([k,v])=>{if(!v)return;wr(k+': '+v,'600 21px '+FF,CW).forEach(l=>{txt(l,Lx,y+14,'600 21px '+FF);y+=31})});

/* Inventario: texto en columna izquierda, el logo del fondo queda libre a la derecha */
.hero.invh>*{flex:none}
.hero.invh>.lb,.hero.invh>.big,.hero.invh>small,.hero.invh>.led{width:58%;max-width:58%}
.hero.invh .lb{font-size:.78rem;white-space:nowrap}
.hero.invh .big{overflow:visible!important}
.hero.invh .led{font-size:.76rem;gap:6px;white-space:nowrap;align-items:center}
.hero.invh .led .v b{font-size:.92rem}
.hero.invh .led,.hero.invh .led:first-of-type{margin-top:12px;padding-top:12px}
.hero.hx::before,.hero.invh::before,.hero.hx::after,.hero.invh::after{display:none!important}
.hero.hx .lb,.hero.invh .lb{color:#dce6f0;font-size:1rem}
.hero.hx small,.hero.hx .mu,.hero.invh small{color:#a3b5ca}
.hero.hx .big:not(.rd),.hero.invh .big{color:#25f0b8!important;text-shadow:0 0 22px rgba(31,224,176,.5)}
.hero.hx .big{font-size:2.15rem}
.hx.s4 .hg{display:grid;grid-template-columns:1fr 1fr;gap:0}
.hx.s4 .hg>div+div{border-left:1px solid rgba(31,224,176,.3);padding-left:16px}
.hx.s4 .led,.hero.invh .led{border-top:1px solid rgba(31,224,176,.28);margin-top:14px;padding-top:14px}
.hx.s4 .led b,.hero.invh .led b{color:#fff}
.hx.s4 .b2.sm{border-radius:999px;border:1px solid rgba(31,224,176,.4);background:rgba(4,12,14,.55);color:#fff;padding:12px 22px;font-weight:700}
.pc,.kp>*{background:linear-gradient(160deg,rgba(10,20,24,.7),rgba(4,9,11,.85));border:1px solid rgba(31,224,176,.22);border-radius:20px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pc[data-st=gr]{box-shadow:0 0 16px -8px var(--nx)}

/* ===== Tema claro: cristal líquido (tarjetas principales, tarjetas, barra) ===== */
:root[data-theme=light]{--nx:#0a9d7c}
:root[data-theme=light] #bgx i{opacity:.32}
:root[data-theme=light] #bgx i:nth-child(2){opacity:.26}
:root[data-theme=light] #bgx i:nth-child(3){opacity:.22}
:root[data-theme=light] :is(.c,.tile,.mv,.hubr,.it,.ban){background:linear-gradient(145deg,rgba(255,255,255,.8),rgba(255,255,255,.44));border-color:rgba(255,255,255,.92);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(10,80,110,.06),0 12px 28px -16px rgba(10,70,100,.32);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8)}
:root[data-theme=light] .kc{background:linear-gradient(145deg,color-mix(in srgb,var(--k) 14%,rgba(255,255,255,.78)),rgba(255,255,255,.46) 72%);border-color:rgba(255,255,255,.92);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),0 12px 28px -16px rgba(10,70,100,.32);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8)}
:root[data-theme=light] :is(.pc,.kp>*){background:linear-gradient(150deg,rgba(255,255,255,.84),rgba(255,255,255,.46));border:1px solid rgba(255,255,255,.92);border-radius:20px;box-shadow:inset 0 1.5px 0 #fff,inset 0 -1px 0 rgba(10,80,110,.06),0 12px 26px -16px rgba(10,70,100,.35);-webkit-backdrop-filter:blur(16px) saturate(1.8);backdrop-filter:blur(16px) saturate(1.8)}
:root[data-theme=light] .pc[data-st=am]{border-left:3px solid var(--am)}
:root[data-theme=light] .pc[data-st=rd]{border-left:3px solid var(--rd)}
:root[data-theme=light] .pc[data-st=gr]{box-shadow:inset 0 1.5px 0 #fff,0 12px 26px -16px rgba(10,150,120,.5)}
:root[data-theme=light] .pc .ms{background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px rgba(10,100,130,.08)}

/* ===== MÓDULO 08 · Empleados y nómina =====
   S.emp={v,n,lvl,deps[],roles[],list[],runs[],adv[],cx[],abs[],att[],log[]} vive dentro de S (se guarda con save()/respaldos).
   Montos en centavos de USD. El empleado guarda su salario en su moneda (e.cur) y la nómina convierte a USD con la tasa del día.
   Dinero: SOLO Finanzas (FIN.reg). La nómina crea UN movimiento (neto) y cada anticipo UNO al entregarse; el costo = bruto, sin duplicar.
   Limitación: Nexora es local (localStorage); los permisos y el ocultar salarios son una barrera de interfaz, no seguridad de servidor. */
const EMP={
 ST:{act:'Activo',pru:'En período de prueba',sus:'Suspendido',ina:'Inactivo',arc:'Archivado'},
 CT:{tc:'Tiempo completo',tp:'Tiempo parcial',hor:'Por horas',tmp:'Temporal',con:'Contratista',otr:'Otro'},
 FQ:{sem:'Semanal',qui:'Quincenal',men:'Mensual',cus:'Personalizada'},

 PS:{bor:'Borrador',rev:'Revisada',apr:'Aprobada',pag:'Pagada',anu:'Anulada'},
 CX:{com:'Comisión',bon:'Bonificación',inc:'Incentivo',ot:'Horas extras',ded:'Deducción'},
 PERM:{adm:'Administrador',ger:'Gerente',rrhh:'Recursos humanos',sup:'Supervisor',emp:'Empleado'},
 get(){if(!S.emp)S.emp={v:1,n:0,lvl:'auto',deps:[],roles:[],list:[],runs:[],adv:[],cx:[],abs:[],att:[],log:[]};return S.emp},
 live(){return EMP.get().list.filter(e=>e.st=='act'||e.st=='pru')},
 by(id){return EMP.get().list.find(e=>e.id==id)},
 run(id){return EMP.get().runs.find(r=>r.id==id)},
 nm(e){return((e.fn||'')+' '+(e.ln||'')).trim()},
 lvl(){const E=EMP.get();return E.lvl!='auto'?E.lvl:(EMP.live().length>5?'full':'basic')},
 usd(a,c){const R=S.rates||{};if(c=='VES')return S.rate>1?Math.round(a/S.rate):0;if(c=='EUR')return R.usd>0&&R.eur>0?Math.round(a*R.eur/R.usd):0;return a},
 mon(e){if(e.kind=='hour')return 0;return Math.round(EMP.usd(e.sal,e.cur)*({sem:52/12,qui:2,men:1,cus:1}[e.fq]||1))},
 log(e,t,txt){EMP.get().log.push({id:uid(),eid:e,ts:Date.now(),t,txt,by:S.owner||''})},
 vg(){return V.eg=V.eg||{t:'lista',sh:0,id:'',run:'',pt:'res',f:{q:'',st:'act',dep:'',ct:''}}},
 /* períodos */
 per(mode){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),f=x=>new Date(x).toLocaleDateString('es-ES',{day:'numeric',month:'short'}),mn=(yy,mm)=>new Date(yy,mm,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});let a,b,lab;
  if(mode=='mes'||mode=='ant'){const mm=mode=='ant'?m-1:m;a=+new Date(y,mm,1);b=+new Date(y,mm+1,1)-1;lab=mn(y,mm)}
  else if(mode=='q1'){a=+new Date(y,m,1);b=+new Date(y,m,16)-1;lab='1ª quincena de '+mn(y,m)}
  else if(mode=='q2'){a=+new Date(y,m,16);b=+new Date(y,m+1,1)-1;lab='2ª quincena de '+mn(y,m)}
  else{const dw=(d.getDay()+6)%7;a=+new Date(y,m,d.getDate()-dw);b=a+7*DAY-1;lab='Semana del '+f(a)}
  return{a,b,lab:lab[0].toUpperCase()+lab.slice(1)}},
 attH(eid,p){return EMP.get().att.filter(x=>x.eid==eid&&x.ts>=p.a&&x.ts<=p.b).reduce((s,x)=>s+(x.h||0),0)},
 /* cálculo de una línea de nómina (no inventa: horas sin datos = 0 y se marca) */
 line(e,p,hrs){const E=EMP.get(),hr=e.kind=='hour',h=hrs!=null?hrs:EMP.attH(e.id,p),base=hr?Math.round(h*EMP.usd(e.sal,e.cur)):EMP.usd(e.sal,e.cur),
  cx=E.cx.filter(c=>c.eid==e.id&&!c.run&&c.ts>=p.a&&c.ts<=p.b),ad=E.adv.filter(a=>a.eid==e.id&&!a.run),sm=t=>cx.filter(c=>c.type==t).reduce((x,c)=>x+c.amt,0),
  ot=sm('ot'),com=sm('com'),bon=sm('bon')+sm('inc'),ded=sm('ded'),adv=ad.reduce((x,a)=>x+a.amt,0),gross=base+ot+com+bon;
  return{eid:e.id,name:EMP.nm(e),role:e.role||'',dep:e.dep||'',cur:e.cur||'USD',sal:e.sal,kind:e.kind||'fix',hrs:h,base,ot,com,bon,ded,adv,gross,net:gross-adv-ded,cx:cx.map(c=>c.id),ad:ad.map(a=>a.id),need:hr&&!h}},
 link(r){const E=EMP.get();r.lines.forEach(l=>{E.cx.forEach(c=>{if(l.cx.includes(c.id))c.run=r.id});E.adv.forEach(a=>{if(l.ad.includes(a.id))a.run=r.id})})},
 unlink(r){const E=EMP.get();E.cx.forEach(c=>{if(c.run==r.id)c.run=''});E.adv.forEach(a=>{if(a.run==r.id)a.run=''})},
 tot(r){const t={base:0,ot:0,com:0,bon:0,ded:0,adv:0,gross:0,net:0};r.lines.forEach(l=>Object.keys(t).forEach(k=>t[k]+=l[k]||0));return t},
 mk(o){const E=EMP.get(),r={id:uid(),per:o.per,pd:o.pd,cur:'USD',st:'bor',ts:Date.now(),lines:[],fin:'',log:[[Date.now(),'Borrador creado']]};
  for(const id of o.ids){const e=EMP.by(id);if(!e)continue;const dup=E.runs.find(x=>x.st!='anu'&&x.lines.some(l=>l.eid==id)&&x.per.a<=o.per.b&&x.per.b>=o.per.a);if(dup)return{err:'Ya hay una nómina ('+dup.per.lab+') que incluye a '+EMP.nm(e)+'.'};r.lines.push(EMP.line(e,o.per))}

 rec(r){if(r.st!='bor')return'Solo se recalcula en borrador.';EMP.unlink(r);r.lines=r.lines.map(l=>{const e=EMP.by(l.eid);return e?EMP.line(e,r.per,l.kind=='hour'?l.hrs:null):l});EMP.link(r);save();return''},
 step(r,to){const ok={bor:['rev'],rev:['apr','bor']}[r.st]||[];if(!ok.includes(to))return'Esa nómina ya no admite este cambio.';if(to=='rev'&&r.lines.some(l=>l.need))return'Faltan horas de un empleado por hora.';if(to=='rev'&&r.lines.some(l=>l.net<0))return'Hay un empleado con neto negativo: revisa anticipos y deducciones.';r.st=to;r.log.push([Date.now(),EMP.PS[to]]);save();return''},
 pay(r,o){if(r.st!='apr')return'La nómina debe estar aprobada.';if(r.fin||r.paid)return'Esta nómina ya fue pagada.';const T=EMP.tot(r);let fid='';
  if(T.net>0){const A=FIN.acc(o.acc);if(!A||A.st!='act')return'Elige una cuenta activa.';const rate=A.cur=='USD'?1:FIN.rt(A.cur);if(!(rate>0))return'Falta la tasa de '+A.cur+'.';
   const er=FIN.reg({type:'exp',cat:'Salarios',desc:'Nómina '+r.per.lab,acc:o.acc,amt:A.cur=='USD'?T.net:Math.round(T.net*rate),sign:-1,ts:o.ts,pm:o.pm,rate,ref:'EMP:'+r.id,note:'Nómina '+r.per.lab});if(er)return er;fid=FIN.last.id}
  r.st='pag';r.fin=fid;r.paid={ts:o.ts,acc:o.acc||'',pm:o.pm||''};r.log.push([Date.now(),'Pagada'+(T.net>0?'':' (cubierta con anticipos)')]);save();return''},

 setSal(e,to,why,ts){if(to==e.sal)return;e.hist.push({ts:ts||Date.now(),from:e.sal,to,why:why||'',by:S.owner||''});e.sal=to;EMP.log(e.id,'sal','Salario: '+usd(e.hist[e.hist.length-1].from)+' → '+usd(to)+(why?' · '+why:''))},
 refs(id){const E=EMP.get();return E.runs.some(r=>r.lines.some(l=>l.eid==id))||E.adv.some(a=>a.eid==id)||E.cx.some(c=>c.eid==id)},
 /* consultas para Dashboard y alertas */
 stats(){const E=EMP.get(),L=EMP.live(),rg=DB.rng(),inR=t=>t>=rg.a&&t<=rg.b,rs=E.runs.filter(x=>x.st=='apr'||x.st=='pag'),
  nom=rs.filter(x=>inR(x.per.b)).reduce((s,x)=>s+EMP.tot(x).gross,0),cost=E.runs.filter(x=>x.st=='pag'&&x.paid&&inR(x.paid.ts)).reduce((s,x)=>s+EMP.tot(x).gross,0),

<h4>3. Dónde se guardan tus datos</h4><p>Toda la información se guarda <b>únicamente en tu dispositivo</b>, en el almacenamiento del navegador. Nexora no tiene cuentas de usuario ni servidores propios donde se almacenen tus datos, y no hay sincronización en la nube. Por eso Inno-Vsion no puede ver, recuperar ni restaurar tu información. Si borras los datos del navegador, cambias de equipo o lo pierdes, podrías perderla salvo que tengas un respaldo.</p>

/* Nexora 67 · build de app: pantalla completa, instalación y cierre de superficies expuestas */
(()=>{
 const H=document.documentElement,mq=q=>{try{return matchMedia(q).matches}catch(e){return false}};
 const app=()=>mq('(display-mode: fullscreen)')||mq('(display-mode: standalone)')||mq('(display-mode: minimal-ui)')||navigator.standalone===true;
 if(app())H.classList.add('is-app');
 /* color de la barra de estado según el tema */
 const tc=()=>{const m=document.querySelector('meta[name=theme-color]');if(m)m.content=H.dataset.theme==='light'?'#eceef6':'#0a0c10'};
 try{new MutationObserver(tc).observe(H,{attributes:true,attributeFilter:['data-theme']});tc()}catch(e){}
 /* si se abre en el navegador, el primer toque pasa a pantalla completa */
 if(!app()){const go=()=>{try{const f=H.requestFullscreen||H.webkitRequestFullscreen;f&&f.call(H,{navigationUI:'hide'}).catch(()=>{})}catch(e){}};addEventListener('pointerup',go,{once:true,passive:true})}
 /* sin menú contextual, sin arrastrar imágenes, sin zoom por gesto */
 addEventListener('contextmenu',e=>{if(!/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||''))e.preventDefault()});
 addEventListener('dragstart',e=>e.preventDefault());
 ['gesturestart','gesturechange','gestureend'].forEach(t=>addEventListener(t,e=>e.preventDefault()));

 try{['log','info','debug','warn','error','trace','table','dir'].forEach(k=>{console[k]=function(){}})}catch(e){}

})();
